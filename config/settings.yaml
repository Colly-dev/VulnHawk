scan:
  timeout: 15
  concurrency: 10
  rate_limit: 0.1 # seconds between requests
  enabled_scanners:
    - xss
    - sqli
    - ssrf
    - lfi
    - xxe
    - ssti
    - redirect
    - exposure
    - headers
  report_formats:
    - html
    - json
  crawl_depth: 2
  crawl_pages: 50

http:
  user_agent: "VulnHawk/1.0 (Web Vulnerability Scanner; +https://github.com/Colly-Dev/VulnHawk)"
  proxy: null
  verify_ssl: true

logging:
  level: INFO
  file: vulnhawk.log
