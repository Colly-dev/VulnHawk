[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnhawk"
version = "1.0.0"
authors = [
  { name="Colly-Dev", email="colly-dev@example.com" },
]
description = "Elite Web Application Vulnerability Scanner with CVSS Scoring, PoC Generation, and Professional Reporting"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rich>=13.5.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "colorlog>=6.7.0",
    "urllib3>=2.1.0",
    "tldextract>=3.4.0",
    "fake-useragent>=1.4.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "asyncio>=3.4.3",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "markdown>=3.5.0",
    "cvss>=2.3.0",
]

[project.urls]
"Homepage" = "https://github.com/Colly-Dev/VulnHawk"
"Bug Tracker" = "https://github.com/Colly-Dev/VulnHawk/issues"

[project.scripts]
vulnhawk = "vulnhawk.vulnhawk:main"
